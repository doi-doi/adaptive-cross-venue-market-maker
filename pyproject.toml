[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "derive-multi-asset-binance-mm-v2"
version = "0.1.0"
description = "Mainnet-only, Binance-reference Derive multi-asset market-making shadow system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "PyYAML>=6.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
derive-multi-asset-shadow = "derive_multi_asset_mm.shadow:main"
derive-multi-asset-dashboard = "derive_multi_asset_mm.dashboard:main"
derive-multi-asset-audit = "derive_multi_asset_mm.audit:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "controllers", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
