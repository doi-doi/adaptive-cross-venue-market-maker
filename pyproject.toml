[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-xrp-cross-venue-market-maker"
version = "1.0.0"
description = "Hummingbot V2 XRP adaptive market maker for Derive with Binance reference data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pydantic>=2.0",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["controllers", "condor", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
